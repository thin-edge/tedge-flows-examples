# The step subscribes to the deployment twins it publishes (to remember the
# current fragments), so looping messages must not be dropped
expect_loop = true

[input]
mqtt.topics = [
    "te/+/+/+/+/cmd/device_profile/+",
    "te/+/+/+/+/twin/+",
]

[[steps]]
script = "lib/main.js"
config.debug = "${params.debug}"
